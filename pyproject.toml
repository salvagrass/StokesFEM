[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stokes-framework"
version = "0.1.0"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.3.0",
]

[tool.setuptools.packages.find]
include = ["problems*", "solvers*", "postprocessing*","common*"]
exclude = ["results*", "benchmarks*","notebooks*"]